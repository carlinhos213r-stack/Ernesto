<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Online</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    min-width: 320px;
  }
  h1 {
    color: #f1f5f9;
    font-size: 18px;
    text-align: center;
    margin: 0 0 24px 0;
    font-weight: 600;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 10px;
    background: #0f172a;
    margin-bottom: 12px;
  }
  .name {
    color: #e2e8f0;
    font-size: 16px;
    font-weight: 500;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
  }
  .online { background: rgba(34,197,94,0.15); color: #4ade80; }
  .online .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .offline { background: rgba(239,68,68,0.15); color: #f87171; }
  .offline .dot { background: #f87171; }
  .unknown { background: rgba(148,163,184,0.15); color: #94a3b8; }
  .unknown .dot { background: #94a3b8; }
  .updated {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 16px;
  }
  .risco {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .risco.seguro {
    background: rgba(34,197,94,0.15);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,0.3);
  }
  .risco.perigoso {
    background: rgba(250,204,21,0.15);
    color: #facc15;
    border: 1px solid rgba(250,204,21,0.3);
  }
  .risco.alerta-laranja {
    background: rgba(251,146,60,0.18);
    color: #fb923c;
    border: 1px solid rgba(251,146,60,0.4);
  }
  .risco.muito-perigoso {
    background: rgba(239,68,68,0.18);
    color: #f87171;
    border: 1px solid rgba(239,68,68,0.4);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>

function mostrarErro(msg) {
  document.getElementById("lista").innerHTML =
    `<div class="status-row"><span class="name">Erro: ${msg}</span></div>`;
}

function renderizar(dados) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  let qtdOnline = 0;

  NOMES.forEach(nome => {
    const valor = dados[nome];
    let classe = "unknown", texto = "Sem dados";
    
    if (valor === "SIM") { 
      classe = "online"; 
      texto = "Online"; 
      qtdOnline++; 
    } else if (valor === "NAO" || valor === "NÃO") { 
      classe = "offline"; 
      texto = "Offline"; 
    }

    // Define o "dot" normal, exceto para o OverTK offline, que usa a imagem
    let dotHtml = `<span class="dot"></span>`;
    if (nome === "[NXS]OverTK" && classe === "offline") {
      dotHtml = `<img src="${OVERTK_IMG}" class="dot-img" alt="status">`;
    }

    const row = document.createElement("div");
    row.className = "status-row";
    row.innerHTML = `
      <span class="name">${nome}</span>
      <span class="badge ${classe}">${dotHtml}${texto}</span>
    `;
    lista.appendChild(row);
  });

  // Sinalização de risco pra dar fila na ranqueada
  const riscoEl = document.getElementById("risco");
  if (qtdOnline >= 3) {
    riscoEl.className = "risco muito-perigoso";
    riscoEl.textContent = "⚠️ MUITO PERIGOSO — não dê fila!";
  } else if (qtdOnline === 2) {
    riscoEl.className = "risco alerta-laranja";
    riscoEl.textContent = "🟠 Alerta — torça para cair no time inimigo";
  } else if (qtdOnline === 1) {
    riscoEl.className = "risco perigoso";
    riscoEl.textContent = "⚠️ Perigoso — cuidado ao dar fila";
  } else {
    riscoEl.className = "risco seguro";
    riscoEl.textContent = "✅ Seguro para dar fila";
  }

  document.getElementById("updated").textContent =
    "Atualizado em " + new Date().toLocaleString("pt-BR");
}

async function buscarComTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const resp = await fetch(url, { signal: controller.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    return await resp.text();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

  try {
    // Adiciona o timestamp no final da URL para burlar cache do navegador
    const texto = await buscarComTimeout(CSV_URL + "&_=" + Date.now(), 8000);

    // Trata quebras de linha e limpa aspas duplas adicionadas pelo Google CSV
    const linhas = texto.split(/\r?\n/);
    const dados = {};

    linhas.forEach(linha => {
      if (!linha.trim()) return;
      
      // Limpa as aspas que o Google coloca em volta de cada célula
      const colunas = linha.split(",").map(col => col.replace(/^"|"$/g, "").trim());
      
      const nome = colunas[0];
      const online = colunas[1];

      if (nome && online) {
        dados[nome] = online.toUpperCase();
      }
    });

    renderizar(dados);

  } catch (e) {
    console.error("Falha ao buscar CSV:", e);
    if (e.name === "AbortError") {
      mostrarErro("Tempo esgotado ao buscar os dados da planilha.");
    } else {
      mostrarErro("Falha de rede ou acesso à planilha negado.");
    }
  }
}

carregarStatus();
// Atualiza a cada 1 minuto
setInterval(carregarStatus, 60 * 1000);
</script>
