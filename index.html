<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Online</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    min-width: 320px;
  }
  h1 {
    color: #f1f5f9;
    font-size: 18px;
    text-align: center;
    margin: 0 0 24px 0;
    font-weight: 600;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 10px;
    background: #0f172a;
    margin-bottom: 12px;
  }
  .name {
    color: #e2e8f0;
    font-size: 16px;
    font-weight: 500;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .online { background: rgba(34,197,94,0.15); color: #4ade80; }
  .online .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .offline { background: rgba(239,68,68,0.15); color: #f87171; }
  .offline .dot { background: #f87171; }
  .unknown { background: rgba(148,163,184,0.15); color: #94a3b8; }
  .unknown .dot { background: #94a3b8; }
  .updated {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Status dos Usuários</h1>
  <div id="lista">
    <div class="status-row"><span class="name">Carregando...</span></div>
  </div>
  <div class="updated" id="updated"></div>
</div>

<script>
// 1) Cole aqui o link "pub?output=csv" que você pegou no Google Sheets:
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ljAo3Ez6jnxTpzUIRKZanU623tmGeyfIAz29PC3vauHZj3o4c0ud_PvIU-wokyKh0cTSf7rqoxrq/pub?gid=0&single=true&output=csv";

// Nomes que queremos exibir, na ordem
const NOMES = ["Ernesto46", "Coordenador01"];

async function carregarStatus() {
  const lista = document.getElementById("lista");
  try {
    const resp = await fetch(CSV_URL + "&t=" + Date.now()); // evita cache
    const texto = await resp.text();

    // parse simples de CSV (Nome,Online)
    const linhas = texto.trim().split("\n").map(l => l.split(","));
    const dados = {};
    linhas.forEach(([nome, online]) => {
      if (nome && online) dados[nome.trim()] = online.trim().toUpperCase();
    });

    lista.innerHTML = "";
    NOMES.forEach(nome => {
      const valor = dados[nome];
      let classe = "unknown", texto = "Sem dados";
      if (valor === "SIM") { classe = "online"; texto = "Online"; }
      else if (valor === "NAO" || valor === "NÃO") { classe = "offline"; texto = "Offline"; }

      const row = document.createElement("div");
      row.className = "status-row";
      row.innerHTML = `
        <span class="name">${nome}</span>
        <span class="badge ${classe}"><span class="dot"></span>${texto}</span>
      `;
      lista.appendChild(row);
    });

    document.getElementById("updated").textContent =
      "Atualizado em " + new Date().toLocaleString("pt-BR");

  } catch (e) {
    lista.innerHTML = '<div class="status-row"><span class="name">Erro ao carregar dados</span></div>';
  }
}

carregarStatus();
// Atualiza automaticamente a cada 5 minutos (bem mais frequente que 1 hora)
setInterval(carregarStatus, 5 * 60 * 1000);
</script>

</body>
</html>
